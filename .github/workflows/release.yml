# Push a tag vX.Y.Z (after scripts/bump_version.py X.Y.Z) to release rumo everywhere:
# tests -> version check -> build -> PyPI (trusted publishing) -> GitHub Release + Homebrew tap
# -> install-check (installs the new version the way users do, on clean machines).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches the package and plugin versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          plugin=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          if [ "v$package" != "$TAG" ] || [ "v$plugin" != "$TAG" ]; then
            echo "::error::tag $TAG does not match pyproject.toml ($package) and plugin.json ($plugin). Run scripts/bump_version.py first."
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rumo-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  homebrew:
    needs: pypi
    runs-on: macos-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.sdist.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the sdist on PyPI
        id: sdist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 1 30); do
            if json=$(curl -fsS "https://pypi.org/pypi/rumo-cli/$version/json"); then
              python3 - "$json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          sdist = next(u for u in json.loads(sys.argv[1])["urls"] if u["packagetype"] == "sdist")
          print(f"url={sdist['url']}")
          print(f"sha256={sdist['digests']['sha256']}")
          PY
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting for PyPI ($attempt/30)"
            sleep 10
          done
          echo "::error::rumo-cli $version did not show up on PyPI"
          exit 1
      - name: Update the formula in pedrobuzzi/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.sdist.outputs.version }}
          URL: ${{ steps.sdist.outputs.url }}
          SHA256: ${{ steps.sdist.outputs.sha256 }}
        run: scripts/update_homebrew_tap.sh "$VERSION" "$URL" "$SHA256"

  install-check:
    needs: [github-release, homebrew]
    uses: ./.github/workflows/install-check.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.homebrew.outputs.version }}
