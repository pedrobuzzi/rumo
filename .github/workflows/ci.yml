name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        shell: bash
        run: |
          uv run python -m unittest discover -s tests -v 2>&1 | tee test.log || {
            # Job logs need a GitHub login, annotations do not: name each failure and its error there.
            grep -E "^(FAIL|ERROR): |^[A-Za-z.]*(Error|Exception): " test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: Smoke test the installed command
        shell: bash
        run: uv run bash scripts/smoke_test.sh "" "$(uv run python -c 'import sys; print(sys.executable)')"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Pyright
        run: |
          uv sync
          uvx pyright --pythonpath .venv/bin/python
