[project]
name = "rumo-cli"
version = "0.2.1"
description = "Your dev work, past, now and later: Markdown files, a terminal Timeline, and AI agents that keep it current"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Buzzi" }]
keywords = ["productivity", "tasks", "todo", "worklog", "markdown", "tui", "claude-code", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = ["textual>=1.0"]

[project.urls]
Homepage = "https://github.com/pedrobuzzi/rumo"
Issues = "https://github.com/pedrobuzzi/rumo/issues"

[project.scripts]
rumo = "rumo.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rumo"]

[tool.hatch.build.targets.sdist]
include = ["src/rumo", "README.md", "LICENSE"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.11"
